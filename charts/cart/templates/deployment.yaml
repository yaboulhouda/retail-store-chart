apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "cart.labels" . | nindent 4 }}
  name: {{ include "cart.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cart.selectorLabels" . | nindent 6 }}
  strategy: {}
  template:
    metadata:
      labels:
        {{- include "cart.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cart.fullname" . }}
      containers:
      - image: "{{ .Values.global.ecrRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: cart
        ports:
          - containerPort: {{ .Values.service.targetPort }}
        env:
          - name: RETAIL_CART_PERSISTENCE_PROVIDER
            valueFrom:
              configMapKeyRef:
                name: {{ include "cart.fullname" . }}
                key: RETAIL_CART_PERSISTENCE_PROVIDER
          - name: RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE
            valueFrom:
              configMapKeyRef:
                name: {{ include "cart.fullname" . }}
                key: RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE
          - name: RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME
            valueFrom:
              configMapKeyRef:
                name: {{ include "cart.fullname" . }}
                key: RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.httpGet.path }}
            port: {{ .Values.livenessProbe.httpGet.port }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.httpGet.path }}
            port: {{ .Values.readinessProbe.httpGet.port }}
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
status: {}
