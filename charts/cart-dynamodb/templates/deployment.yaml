apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "cart-dynamodb.labels" . | nindent 4 }}
  name: {{ include "cart-dynamodb.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cart-dynamodb.selectorLabels" . | nindent 6 }}
  strategy: {}
  template:
    metadata:
      labels:
        {{- include "cart-dynamodb.labels" . | nindent 8 }}
    spec:
      containers:
        - image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          name: dynamodb
          ports:
            - containerPort: {{ include "cart-dynamodb.port" . }}
          resources: {}
