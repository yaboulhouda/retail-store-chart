apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-connection
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: {{ include "orders.fullname" . }}
    creationPolicy: Orphan
  data:
    - secretKey: RETAIL_ORDERS_PERSISTENCE_ENDPOINT
      remoteRef:
        key: /retail-store/{{ .Values.global.env }}/orders/host
    - secretKey: RETAIL_ORDERS_PERSISTENCE_NAME
      remoteRef:
        key: /retail-store/{{ .Values.global.env }}/orders/dbname
    - secretKey: RETAIL_ORDERS_PERSISTENCE_USERNAME
      remoteRef:
        key: /retail-store/{{ .Values.global.env }}/orders/username
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: {{ include "orders.fullname" . }}
    creationPolicy: Merge
  data:
    - secretKey: RETAIL_ORDERS_PERSISTENCE_PASSWORD
      remoteRef:
        key: "{{ .Values.global.postgres.secretArn }}"
        property: password