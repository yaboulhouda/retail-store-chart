apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "orders.labels" . | nindent 4 }}
  name: {{ include "orders.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "orders.selectorLabels" . | nindent 6 }}
  strategy: {}
  template:
    metadata:
      labels:
        {{- include "orders.labels" . | nindent 8 }}
    spec:
      containers:
      - image: "{{ .Values.global.ecrRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: orders
        ports:
          - containerPort: {{ .Values.service.targetPort }}
        env:
          - name: RETAIL_ORDERS_PERSISTENCE_PROVIDER
            value: {{ .Values.global.postgres.provider }}
          - name: RETAIL_ORDERS_PERSISTENCE_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: {{ include "orders.fullname" . }}
                key: RETAIL_ORDERS_PERSISTENCE_ENDPOINT
          - name: RETAIL_ORDERS_PERSISTENCE_NAME
            valueFrom:
              secretKeyRef:
                name: {{ include "orders.fullname" . }}
                key: RETAIL_ORDERS_PERSISTENCE_NAME
          - name: RETAIL_ORDERS_PERSISTENCE_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ include "orders.fullname" . }}
                key: RETAIL_ORDERS_PERSISTENCE_USERNAME
          - name: RETAIL_ORDERS_PERSISTENCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ include "orders.fullname" . }}
                key: RETAIL_ORDERS_PERSISTENCE_PASSWORD
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.httpGet.path }}
            port: {{ .Values.livenessProbe.httpGet.port }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.httpGet.path }}
            port: {{ .Values.readinessProbe.httpGet.port }}
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
status: {}
